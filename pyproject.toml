[project]
name = "interop-router"
version = "0.4.0"
description = "Interoperate between AI providers using the OpenAI Responses API as a common interface."
readme = "README.md"
authors = [
    { name = "David Koleczek", email = "45405824+DavidKoleczek@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "anthropic[aiohttp]>=0.120.2,<1.0",
    "google-genai[aiohttp]>=2.16,<3.0",
    "openai[aiohttp]>=2.52,<3.0",
    "pillow>=12,<13",
    "pydantic>=2.13.4,<3.0",
    "tiktoken>=0.9,<1.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3",
    "nbclient>=0.11.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv]
exclude-newer = "3 days"
exclude-newer-package = { anthropic = false }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "RUF", # ruff
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake-pytest-style
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line-too-long (formatter makes best-effort attempt)
    # The following rules conflict with the formatter, see: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab-indentation
    "E111",   # indentation-with-invalid-multiple
    "E114",   # indentation-with-invalid-multiple-comment
    "E117",   # over-indented
    "ISC002", # multi-line-implicit-string-concatenation
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ty.src]
exclude = ["reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
